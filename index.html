<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Navya Agarwal</title>
  <meta name="description" content="Navya Agarwal — Senior Software Engineer at Adobe, accessibility advocate, W3C ARIA Working Group contributor, and global speaker." />
  <meta name="author" content="Navya Agarwal" />
  <meta property="og:title" content="Navya Agarwal" />
  <meta property="og:description" content="Senior Software Engineer at Adobe · W3C ARIA Working Group · Global Accessibility Speaker" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared.css" />
  <script src="/theme.js"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 380px;
      width: 100%;
    }

    /* ── Avatar ── */
    .avatar {
      width: 125px;
      height: 125px;
      border-radius: 100%;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    /* ── Name & title ── */
    h1.name {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: var(--fg);
    }

    .tagline {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 20px;
    }

    .bio {
      font-size: 14px;
      color: var(--fg);
      line-height: 1.7;
      margin-bottom: 24px;
      text-align: left;
    }

    /* ── Social icons ── */
    .social {
      display: flex;
      gap: 14px;
      margin-bottom: 36px;
      align-items: center;
    }
    .social a {
      color: var(--muted);
      transition: color 0.15s;
      display: flex;
      align-items: center;
    }
    .social a:hover { color: var(--accent); }
    .social svg { width: 18px; height: 18px; }

    /* ── Nav links ── */
    nav {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 2px;
    }
    nav a {
      text-decoration: none;
      color: var(--accent);
      font-size: 14px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: var(--radius);
      transition: background 0.12s, color 0.12s;
    }
    nav a:hover {
      background: var(--accent-soft);
    }

    /* ── Footer ── */
    footer {
      margin-top: 48px;
      font-size: 12px;
      color: var(--muted);
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
  </button>

  <div class="card">

    <div class="avatar">
      <img src="/assets/photo.jpg" alt="Navya Agarwal" />
    </div>

    <h1 class="name">Navya Agarwal</h1>
    <p class="tagline">
      Senior Software Engineer · Adobe<br />
      W3C ARIA Working Group · ICC Member
    </p>

    <div class="social">
      <!-- LinkedIn -->
      <a href="https://www.linkedin.com/in/navya-agarwal/" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>
      <!-- Email -->
      <a href="mailto:navya.agwl@gmail.com" aria-label="Email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
      </a>
    </div>

    <nav>
      <a href="/talks/">Talks</a>
      <a href="/writing/">Writing</a>
      <a href="/press/">Press &amp; Interviews</a>
      <a href="/jury/">Awards Jury</a>
      <a href="/advisory/">Advisory</a>
    </nav>

  </div>

  <footer>Navya Agarwal © 2026</footer>

</body>
</html>
